apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ckad
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 3
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - image: ckad-frontend:v1
        name: frontend
        envFrom:
        - configMapRef:
            name: frontend-config         
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 256Mi
