apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: demo
  name: demo
  namespace: rollout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo
  strategy:
    type: Recreate
    # type: RollingUpdate
    # rollingUpdate:
    #   maxUnavailable: 0
    #   maxSurge: 1
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
      - image: nginx:1.26
        name: nginx
