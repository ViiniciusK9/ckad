apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ckad
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 3
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - image: ckad-backend:v1
        name: backend
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 256Mi
